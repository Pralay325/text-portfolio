<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রলয় চক্রবর্তীর পোর্টফোলিও</title>
    <style>
        /* পুরো পাতার ব্যাকগ্রাউন্ড ডিজাইন */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        /* মাঝখানের সাদা কার্ড */
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        /* শিরোনাম */
        h1 {
            color: #1e3c72;
            font-size: 28px;
            margin-bottom: 12px;
        }

        /* বিবরণ */
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* রঙিন বোতাম */
        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff512f, #dd2476);
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(221, 36, 118, 0.3);
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>স্বাগতম!</h1>
        <p>আমি ভিএস কোড, গিট ও গিটহাব ব্যবহার করে আমার নিজস্ব ওয়েব পোর্টফোলিও তৈরি করছি।</p>
        <a href="#contact" class="btn">যোগাযোগ করুন</a>
    </div>

</body>
</html>
